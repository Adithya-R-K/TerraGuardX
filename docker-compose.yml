services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_USER: tgx, POSTGRES_PASSWORD: tgx, POSTGRES_DB: terraguardx}
    healthcheck: {test: ["CMD-SHELL","pg_isready -U tgx"], interval: 5s, retries: 10}
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [.env.example]
    environment: {DATABASE_URL: "postgresql://tgx:tgx@postgres:5432/terraguardx"}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment: {VITE_API: "http://localhost:8000"}
    ports: ["5173:5173"]
    depends_on: [backend]

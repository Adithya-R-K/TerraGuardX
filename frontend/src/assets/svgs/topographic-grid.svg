<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.12" />
      <circle cx="20" cy="20" r="0.75" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.18" />
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#grid)" />
  <rect width="100" height="100" fill="url(#majorGrid)" />
</svg>
